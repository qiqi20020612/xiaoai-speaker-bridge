name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to rebuild and validate (empty for normal CI)"
        type: string
        default: ""
      publish:
        description: "Publish a NEW release after all checks pass"
        type: boolean
        default: false
      channel:
        description: "Must agree with the tag version"
        type: choice
        options: [auto, stable, prerelease]
        default: auto

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: HA 2026.10 and native endpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Checksum-verified real jq 1.6 (every speaker script test)
        run: |
          mkdir -p build/jq16/bin
          curl --fail --location --retry 3 https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64 --output build/jq16/bin/jq
          printf '%s\n' 'af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44  build/jq16/bin/jq' | sha256sum --check
          chmod 755 build/jq16/bin/jq
          test "$(build/jq16/bin/jq --version)" = jq-1.6
          echo "$PWD/build/jq16/bin" >> "$GITHUB_PATH"
          echo "XIAOAI_TEST_JQ16=$PWD/build/jq16/bin/jq" >> "$GITHUB_ENV"
      - name: Build checksum-verified BusyBox 1.36.1 ash, flock, awk and sed
        run: |
          mkdir -p build
          curl --fail --location --retry 3 https://busybox.net/downloads/busybox-1.36.1.tar.bz2 --output build/busybox-1.36.1.tar.bz2
          printf '%s\n' 'b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314  build/busybox-1.36.1.tar.bz2' | sha256sum --check
          tar -xjf build/busybox-1.36.1.tar.bz2 -C build
          make -C build/busybox-1.36.1 allnoconfig > build/busybox-config.log
          while IFS= read -r setting; do
            case "$setting" in CONFIG_*=y)
              option=${setting%=y}
              sed -i "s/^# $option is not set$/$setting/" build/busybox-1.36.1/.config
            esac
          done < tests/busybox.config
          make -C build/busybox-1.36.1 oldconfig < /dev/null >> build/busybox-config.log
          make -j2 -C build/busybox-1.36.1 busybox
          build/busybox-1.36.1/busybox > build/busybox-version.txt 2>&1
          grep -F 'BusyBox v1.36.1' build/busybox-version.txt
          build/busybox-1.36.1/busybox --list | grep -Fx ash
          build/busybox-1.36.1/busybox --list | grep -Fx flock
          build/busybox-1.36.1/busybox --list | grep -Fx awk
          build/busybox-1.36.1/busybox --list | grep -Fx sed
          echo "XIAOAI_TEST_BUSYBOX=$PWD/build/busybox-1.36.1/busybox" >> "$GITHUB_ENV"
      - name: Privacy and integration metadata
        run: |
          python tools/privacy_audit.py
          python tools/validate_metadata.py
      - name: Python and C formatting
        run: |
          ruff check .
          ruff format --check .
          clang-format --dry-run --Werror speaker/src/*.c speaker/src/*.h tests/json_test.c tests/json_ops_cli.c
      - name: C compiler and sanitizers
        run: |
          make -C speaker
          make -C speaker check
          echo "XIAOAI_TEST_JSON_SANITIZER=$PWD/build/json_ops_sanitized" >> "$GITHUB_ENV"
      - name: POSIX shell static checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -s sh -e SC1090,SC1091,SC2034,SC2016,SC2015 speaker/*.sh speaker/lib/*.sh speaker/tools/*.sh
      - name: Real BusyBox, HA fixtures and installer failure regression tests
        run: python -m pytest --junitxml=build/tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lx06-regression-test-results
          path: build/tests.xml
          retention-days: 7

  armhf:
    name: ARM hard-float static package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Fetch checksum-verified cross compiler
        run: |
          curl --fail --location --retry 3 https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz --output zig.tar.xz
          printf '%s\n' '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig.tar.xz' | sha256sum --check
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"
      - name: Build static ARM EABI5 endpoint
        run: make -C speaker CC='zig cc -target arm-linux-musleabihf -static' LDFLAGS='-s' OUT=../build/armhf/xiaoai_bridge
      - name: Inspect ELF and emulate endpoint plus JSON/record trace helpers
        run: |
          file build/armhf/xiaoai_bridge
          readelf -h build/armhf/xiaoai_bridge
          if readelf -l build/armhf/xiaoai_bridge | grep -q INTERP; then exit 1; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-arm build/armhf/xiaoai_bridge --version
          python tools/qemu_smoke.py --binary build/armhf/xiaoai_bridge
      - name: Package checked LX06 EABI5 hard-float and HA assets
        run: |
          python -m tools.release package --binary build/armhf/xiaoai_bridge --output dist
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generic-two-end-packages
          path: dist/
          retention-days: 30

  hassfest:
    name: Home Assistant integration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  hacs:
    name: HACS repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: false

  release:
    name: Publish a new tested tag (never overwrite)
    needs: [tests, armhf, hassfest, hacs]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate exact existing tag and all version fields
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python -m tools.release validate --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: generic-two-end-packages
          path: dist
          digest-mismatch: error
      - name: Verify assets, upload to a new draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'auto' }}
        run: python -m tools.release publish --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --channel "$RELEASE_CHANNEL" --output dist
