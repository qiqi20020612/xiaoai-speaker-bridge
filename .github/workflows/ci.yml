name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: HA 2026.10 and native endpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Require actual BusyBox 1.36.1 ash and flock
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox
          /usr/bin/busybox 2>&1 | head -n 1 | grep 'BusyBox v1.36.1'
          echo 'XIAOAI_TEST_BUSYBOX=/usr/bin/busybox' >> "$GITHUB_ENV"
      - name: Privacy and integration metadata
        run: |
          python tools/privacy_audit.py
          python tools/validate_metadata.py
      - name: Python and C formatting
        run: |
          ruff check .
          ruff format --check .
          clang-format --dry-run --Werror speaker/src/*.c speaker/src/*.h tests/json_test.c
      - name: C compiler and sanitizers
        run: |
          make -C speaker
          make -C speaker check
      - name: Real BusyBox, HA fixtures and installer failure regression tests
        run: python -m pytest --junitxml=build/tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-test-results
          path: build/tests.xml
          retention-days: 7

  armhf:
    name: ARM hard-float static package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Fetch checksum-verified cross compiler
        run: |
          curl --fail --location --retry 3 https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz --output zig.tar.xz
          printf '%s\n' '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig.tar.xz' | sha256sum --check
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"
      - name: Build static ARM EABI5 endpoint
        run: make -C speaker CC='zig cc -target arm-linux-musleabihf -static' LDFLAGS='-s' OUT=../build/armhf/xiaoai_bridge
      - name: Inspect ELF and emulate CLI only
        run: |
          file build/armhf/xiaoai_bridge
          readelf -h build/armhf/xiaoai_bridge
          if readelf -l build/armhf/xiaoai_bridge | grep -q INTERP; then exit 1; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-arm build/armhf/xiaoai_bridge --version
      - name: Package generic speaker endpoint and HA integration
        run: |
          python tools/package_speaker.py --binary build/armhf/xiaoai_bridge --output dist/xiaoai-bridge-armhf.tar.gz
          zip -q -r dist/xiaoai-speaker-ha.zip custom_components/xiaoai_speaker
          cd dist
          sha256sum xiaoai-bridge-armhf.tar.gz xiaoai-speaker-ha.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generic-two-end-packages
          path: dist/
          retention-days: 30

  hassfest:
    name: Home Assistant integration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  hacs:
    name: HACS repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: false
