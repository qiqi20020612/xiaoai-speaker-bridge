[project]
name = "xiaoai-speaker-bridge"
version = "0.1.4"
description = "Home Assistant integration and lightweight LX06 control endpoint"
requires-python = ">=3.14.2"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]
