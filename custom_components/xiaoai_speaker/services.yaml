announce:
  fields:
    device_id: &id001
      selector:
        device:
          integration: xiaoai_speaker
    entity_id: &id002
      selector:
        entity:
          integration: xiaoai_speaker
    text: &id003
      required: true
      selector:
        text:
          multiline: true
    volume:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: '%'
    priority: &id004
      default: normal
      selector:
        select:
          options:
          - normal
          - urgent
    request_id: &id005
      selector: &id009
        text: {}
    wait: &id006
      default: false
      selector:
        boolean: {}
send_text:
  fields:
    device_id: *id001
    entity_id: *id002
    text: *id003
    speak_response:
      default: true
      selector:
        boolean: {}
    use_context:
      default: true
      selector:
        boolean: {}
    agent_id:
      selector:
        entity:
          domain: conversation
    priority: *id004
    request_id: *id005
    wait: *id006
set_volume:
  fields:
    device_id: *id001
    entity_id: *id002
    target: &id007
      default: auto
      selector:
        select:
          options:
          - auto
          - master
          - tts
          - bluetooth
          - headphone
          - airplay
          - all
    level:
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: '%'
volume_up:
  fields:
    device_id: *id001
    entity_id: *id002
    target: *id007
    step: &id008
      default: 10
      selector:
        number:
          min: 1
          max: 100
volume_down:
  fields:
    device_id: *id001
    entity_id: *id002
    target: *id007
    step: *id008
cancel_job:
  fields:
    device_id: *id001
    entity_id: *id002
    request_id:
      selector: *id009
      required: true
get_job:
  fields:
    device_id: *id001
    entity_id: *id002
    request_id:
      selector: *id009
      required: true
set_idle_volume_policy:
  fields:
    device_id: *id001
    entity_id: *id002
    policy:
      required: true
      selector:
        select:
          options:
          - master
          - tts
          - master_tts
get_queue:
  fields:
    device_id: *id001
    entity_id: *id002
send_ir:
  fields:
    device_id: *id001
    entity_id: *id002
    code:
      required: true
      selector:
        text:
          multiline: true
    carrier:
      default: 38000
      selector:
        number:
          min: 20000
          max: 60000
