# Merge these two named scripts into HA scripts.yaml (after replacing entities).
speaker_send_text:
  alias: 小爱文字对话
  mode: single
  sequence:
    - action: xiaoai_speaker.send_text
      data:
        entity_id: media_player.your_speaker
        text: "{{ states('input_text.speaker_conversation') }}"
        speak_response: true
        use_context: true
        wait: true

speaker_read_text:
  alias: 小爱仅朗读
  mode: single
  sequence:
    - action: xiaoai_speaker.announce
      data:
        entity_id: media_player.your_speaker
        text: "{{ states('input_text.speaker_conversation') }}"
        wait: true
