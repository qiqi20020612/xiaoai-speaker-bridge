# Optional native HA UI; replace all IDs with the retained registry Entity IDs.
# Text entities submit directly (255 characters); services still accept 4096 bytes.
type: vertical-stack
cards:
  - type: media-control
    entity: media_player.your_speaker
  - type: entities
    entities:
      - text.your_speaker_play_text
      - text.your_speaker_execute_text_directive
      - number.your_speaker_tts_volume
      - number.your_speaker_bluetooth_volume
      - number.your_speaker_master_volume
  - type: button
    entity: button.your_speaker_restart_bridge
    name: 重启桥接
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.your_speaker_restart_bridge
      confirmation:
        text: 仅重启 XiaoAI Bridge，继续吗？
